<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Numeric Clock</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        #revision {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        #clock {
            font-size: 48px;
        }

        #status {
            font-size: 20px;
            margin-top: 16px;
        }

        #lastsync {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="revision">REV 7</div>

    <h2>Patchworld Numeric Clock</h2>

    <div id="clock">--:--:--</div>

    <div id="status">
        Waiting for Patchworld...
    </div>

    <div id="lastsync">
        No sync sent yet.
    </div>


    <script>

        // ---------------------------------------------------------
        // CURRENT LOCAL TIME AS WHOLE SECONDS SINCE MIDNIGHT
        // ---------------------------------------------------------

        function secondsSinceMidnight() {

            const now = new Date();

            return (
                now.getHours() * 3600 +
                now.getMinutes() * 60 +
                now.getSeconds()
            );
        }


        // ---------------------------------------------------------
        // VISIBLE WEBPAGE CLOCK
        // ---------------------------------------------------------

        function updatePageDisplay() {

            const now = new Date();

            const time = now.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            document.getElementById("clock").textContent = time;
        }


        // ---------------------------------------------------------
        // SEND CURRENT TIME TO PATCHWORLD
        // ---------------------------------------------------------

        async function sendClockSync(source) {

            const value = secondsSinceMidnight();

            try {

                await PatchWorld.interfaceSendJoltA(value);

                document.getElementById("status").textContent =
                    "Clock synchronized";

                document.getElementById("lastsync").textContent =
                    "Last sync: " +
                    value +
                    " seconds since midnight" +
                    " (" + source + ")";

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Patchworld bridge not available";
            }
        }


        // ---------------------------------------------------------
        // SEND CURRENT UNIX TIMESTAMP WIRELESSLY
        // ---------------------------------------------------------

        async function sendUtcNow() {

            const value = Math.floor(Date.now() / 1000);

            try {

                await PatchWorld.sendWirelessJolt(
                    "receive utc now",
                    value
                );

                document.getElementById("status").textContent =
                    "UTC timestamp sent: " + value;

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "UTC timestamp send failed";
            }
        }


        // ---------------------------------------------------------
        // CONVERT UNIX TIMESTAMP TO LOCAL YYMMDDHHMM
        // ---------------------------------------------------------

        async function sendLocalTime(utcSeconds) {

            const timestamp = Number(utcSeconds);

            if (!Number.isFinite(timestamp)) {

                document.getElementById("status").textContent =
                    "Invalid UTC timestamp";

                return;
            }

            const date = new Date(timestamp * 1000);

            const year = date.getFullYear() % 100;
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hour = date.getHours();
            const minute = date.getMinutes();

            const value =
                year * 100000000 +
                month * 1000000 +
                day * 10000 +
                hour * 100 +
                minute;

            try {

                await PatchWorld.sendWirelessJolt(
                    "receive local time",
                    value
                );

                document.getElementById("status").textContent =
                    "Local time sent: " + value;

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Local time send failed";
            }
        }


        // ---------------------------------------------------------
        // PATCHWORLD REQUESTS A CLOCK SYNC
        // ---------------------------------------------------------

        PatchWorld.onInterfaceInputJoltA = function(value) {

            sendClockSync("Jolt In A");
        };


        // ---------------------------------------------------------
        // INITIAL BRIDGE CONNECTION
        // ---------------------------------------------------------

        PatchWorld.onData = function(context) {

            document.getElementById("status").textContent =
                "Patchworld connected";

            PatchWorld.subscribeWifi(
                "request utc now",
                function(value) {
                    sendUtcNow();
                }
            );

            PatchWorld.subscribeWifi(
                "send utc time",
                function(value) {
                    sendLocalTime(value);
                }
            );

            sendClockSync("initial connection");
        };


        // ---------------------------------------------------------
        // QUEST / PATCHWORLD WAKE DETECTION
        // ---------------------------------------------------------

        document.addEventListener(
            "visibilitychange",
            function() {

                if (document.visibilityState === "visible") {

                    document.getElementById("status").textContent =
                        "Resuming - synchronizing";

                    sendClockSync("wake");
                }
            }
        );


        // ---------------------------------------------------------
        // START VISIBLE WEBPAGE CLOCK
        // ---------------------------------------------------------

        updatePageDisplay();

        setInterval(
            updatePageDisplay,
            1000
        );

    </script>

</body>
</html>
