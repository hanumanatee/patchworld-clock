<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Numeric Clock</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #clock {
            font-size: 48px;
        }

        #status {
            font-size: 24px;
            margin-top: 20px;
        }

        #lastsync {
            font-size: 20px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <h2>Patchworld Numeric Clock</h2>

    <div id="clock">--:--:--</div>
    <div id="status">Waiting for sync request from Patchworld...</div>
    <div id="lastsync">No sync sent yet.</div>

    <script>

        // Return local time as seconds since midnight.
        // Milliseconds are included for a more accurate synchronization.
        function secondsSinceMidnight() {
            const now = new Date();

            return (
                now.getHours() * 3600 +
                now.getMinutes() * 60 +
                now.getSeconds() +
                now.getMilliseconds() / 1000
            );
        }


        // This display is only for checking the webpage.
        // It does NOT send anything to Patchworld.
        function updatePageDisplay() {
            const now = new Date();

            const time = now.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            document.getElementById("clock").textContent = time;
        }


        // Read the current local time and send it to Patchworld.
        async function sendClockSync() {
            const value = secondsSinceMidnight();

            try {
                await PatchWorld.interfaceSendJoltA(value);

                document.getElementById("status").textContent =
                    "Sync request received.";

                document.getElementById("lastsync").textContent =
                    "Sent: " + value.toFixed(3) + " seconds since midnight";

                console.log("Clock sync sent to Patchworld:", value);

            } catch (error) {

                document.getElementById("status").textContent =
                    "Patchworld bridge not available.";

                console.log("Patchworld bridge not available:", error);
            }
        }


        // Patchworld Jolt In A is the clock-sync request.
        PatchWorld.onInterfaceInputJoltA = function(value) {
            console.log("Sync request received from Patchworld:", value);
            sendClockSync();
        };


        // Keep the webpage's visible clock running for debugging.
        // This does NOT communicate with Patchworld.
        updatePageDisplay();
        setInterval(updatePageDisplay, 1000);

    </script>

</body>
</html>
