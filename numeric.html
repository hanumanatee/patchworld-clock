<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Numeric Clock</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #clock {
            font-size: 48px;
        }

        #seconds {
            font-size: 28px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>Patchworld Numeric Clock</h2>

    <div id="clock">--:--:--</div>
    <div id="seconds">Seconds since midnight: -----</div>

    <script>
        function secondsSinceMidnight() {
            const now = new Date();

            return (
                now.getHours() * 3600 +
                now.getMinutes() * 60 +
                now.getSeconds()
            );
        }

        function updatePageDisplay() {
            const now = new Date();

            const time = now.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            document.getElementById("clock").textContent = time;
            document.getElementById("seconds").textContent =
                "Seconds since midnight: " + secondsSinceMidnight();
        }

        async function syncPatchworldClock() {
            const value = secondsSinceMidnight();

            try {
                await PatchWorld.interfaceSendJoltA(value);
                console.log("Sent to Patchworld:", value);
            } catch (error) {
                console.log("Patchworld bridge not available:", error);
            }
        }

        updatePageDisplay();
        syncPatchworldClock();

        setInterval(updatePageDisplay, 1000);

        // Temporary test interval:
        // send a fresh synchronization value every 10 seconds.
        setInterval(syncPatchworldClock, 10000);
    </script>

</body>
</html>
