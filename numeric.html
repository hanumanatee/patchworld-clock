<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Numeric Clock</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #clock {
            font-size: 48px;
        }

        #status {
            font-size: 24px;
            margin-top: 20px;
        }

        #lastsync {
            font-size: 20px;
            margin-top: 12px;
        }

        #visibility {
            font-size: 20px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <h2>Patchworld Numeric Clock</h2>

    <div id="clock">--:--:--</div>

    <div id="status">
        Waiting for Patchworld...
    </div>

    <div id="lastsync">
        No sync sent yet.
    </div>

    <div id="visibility">
        Visibility: unknown
    </div>


    <script>

        // ---------------------------------------------------------
        // GET CURRENT LOCAL TIME AS SECONDS SINCE MIDNIGHT
        // ---------------------------------------------------------

        function secondsSinceMidnight() {

            const now = new Date();

            return (
                now.getHours() * 3600 +
                now.getMinutes() * 60 +
                now.getSeconds() +
                now.getMilliseconds() / 1000
            );
        }


        // ---------------------------------------------------------
        // UPDATE THE VISIBLE CLOCK ON THE WEBPAGE
        //
        // This is only for debugging/confirmation.
        // It sends nothing to Patchworld.
        // ---------------------------------------------------------

        function updatePageDisplay() {

            const now = new Date();

            const time = now.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            document.getElementById("clock").textContent = time;
        }


        // ---------------------------------------------------------
        // SEND CURRENT TIME TO PATCHWORLD
        //
        // Output:
        // Web Bridge -> Jolt Out A
        // ---------------------------------------------------------

        async function sendClockSync() {

            const value = secondsSinceMidnight();

            try {

                await PatchWorld.interfaceSendJoltA(value);

                document.getElementById("status").textContent =
                    "Clock synchronized.";

                document.getElementById("lastsync").textContent =
                    "Sent: " +
                    value.toFixed(3) +
                    " seconds since midnight";

                console.log(
                    "Clock sync sent to Patchworld:",
                    value
                );

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Patchworld bridge not available.";

                console.log(
                    "Patchworld bridge not available:",
                    error
                );
            }
        }


        // ---------------------------------------------------------
        // PATCHWORLD REQUESTS A CLOCK SYNC
        //
        // A Jolt arriving at Web Bridge Jolt In A
        // causes an immediate fresh time reading.
        // ---------------------------------------------------------

        PatchWorld.onInterfaceInputJoltA = function(value) {

            console.log(
                "Sync request received from Patchworld:",
                value
            );

            sendClockSync();
        };


        // ---------------------------------------------------------
        // INITIAL CONNECTION
        //
        // When the Web Bridge establishes communication with
        // this page, immediately send one clock synchronization.
        // ---------------------------------------------------------

        PatchWorld.onData = function(context) {

            console.log(
                "Patchworld bridge connected."
            );

            document.getElementById("status").textContent =
                "Patchworld connected.";

            sendClockSync();
        };


        // ---------------------------------------------------------
        // VISIBILITY CHANGE TEST
        //
        // For now this ONLY reports visibility changes.
        // It deliberately does NOT synchronize the clock.
        //
        // We want to determine whether Patchworld's embedded
        // browser generates this event when the Quest is removed
        // and subsequently put back on.
        // ---------------------------------------------------------

        document.getElementById("visibility").textContent =
            "Visibility: " + document.visibilityState;

        document.addEventListener(
            "visibilitychange",
            function() {

                const state = document.visibilityState;

                document.getElementById("visibility").textContent =
                    "Visibility changed: " + state;

                document.getElementById("status").textContent =
                    "Visibility event received: " + state;

                console.log(
                    "Visibility changed:",
                    state
                );
            }
        );


        // ---------------------------------------------------------
        // START VISIBLE WEBPAGE CLOCK
        // ---------------------------------------------------------

        updatePageDisplay();

        setInterval(
            updatePageDisplay,
            1000
        );

    </script>

</body>
</html>
