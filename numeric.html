<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Numeric Clock</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        #revision {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        #clock {
            font-size: 48px;
        }

        #status {
            font-size: 20px;
            margin-top: 16px;
        }

        #lastsync {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div id="revision">REV 13</div>

    <h2>Patchworld Numeric Clock</h2>

    <div id="clock">--:--:--</div>

    <div id="status">
        Waiting for Patchworld...
    </div>

    <div id="lastsync">
        No sync sent yet.
    </div>


    <script>

        // ---------------------------------------------------------
        // STORAGE FOR INCOMING UTC TIMESTAMP PARTS
        // ---------------------------------------------------------

        let pendingUtcHigh = null;
        let pendingUtcLow = null;


        // ---------------------------------------------------------
        // CURRENT LOCAL TIME AS WHOLE SECONDS SINCE MIDNIGHT
        // ---------------------------------------------------------

        function secondsSinceMidnight() {

            const now = new Date();

            return (
                now.getHours() * 3600 +
                now.getMinutes() * 60 +
                now.getSeconds()
            );
        }


        // ---------------------------------------------------------
        // VISIBLE WEBPAGE CLOCK
        // ---------------------------------------------------------

        function updatePageDisplay() {

            const now = new Date();

            const time = now.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            document.getElementById("clock").textContent = time;
        }


        // ---------------------------------------------------------
        // SEND CURRENT TIME TO PATCHWORLD
        // ---------------------------------------------------------

        async function sendClockSync(source) {

            const value = secondsSinceMidnight();

            try {

                await PatchWorld.interfaceSendJoltA(value);

                document.getElementById("status").textContent =
                    "Clock synchronized";

                document.getElementById("lastsync").textContent =
                    "Last sync: " +
                    value +
                    " seconds since midnight" +
                    " (" + source + ")";

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Patchworld bridge not available";
            }
        }


        // ---------------------------------------------------------
        // SEND CURRENT UNIX TIMESTAMP AS TWO WIRELESS VALUES
        // ---------------------------------------------------------

        async function sendUtcNow() {

            const timestamp = Math.floor(Date.now() / 1000);

            const high = Math.floor(timestamp / 100000);
            const low = timestamp % 100000;

            try {

                await PatchWorld.sendWirelessJolt(
                    "receive utc high",
                    high
                );

                await PatchWorld.sendWirelessJolt(
                    "receive utc low",
                    low
                );

                document.getElementById("status").textContent =
                    "UTC timestamp sent";

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "UTC timestamp send failed";
            }
        }


        // ---------------------------------------------------------
        // SEND CURRENT LOCAL DATE WIRELESSLY
        //
        // Returned as DYYMMDD
        //
        // D:
        // 0 = Sunday
        // 1 = Monday
        // 2 = Tuesday
        // 3 = Wednesday
        // 4 = Thursday
        // 5 = Friday
        // 6 = Saturday
        // ---------------------------------------------------------

        async function sendLocalDate() {

            const now = new Date();

            const weekday = now.getDay();
            const year = now.getFullYear() % 100;
            const month = now.getMonth() + 1;
            const day = now.getDate();

            const value =
                weekday * 1000000 +
                year * 10000 +
                month * 100 +
                day;

            try {

                await PatchWorld.sendWirelessJolt(
                    "receive local date",
                    value
                );

                document.getElementById("status").textContent =
                    "Local date sent: " + value;

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Local date send failed";
            }
        }


        // ---------------------------------------------------------
        // ACCEPT ONE HALF OF A STORED UTC TIMESTAMP
        // ---------------------------------------------------------

        function receiveUtcHigh(value) {

            const number = Number(value);

            if (!Number.isFinite(number)) {

                document.getElementById("status").textContent =
                    "Invalid UTC high value";

                return;
            }

            pendingUtcHigh = number;

            tryReconstructUtc();
        }


        function receiveUtcLow(value) {

            const number = Number(value);

            if (!Number.isFinite(number)) {

                document.getElementById("status").textContent =
                    "Invalid UTC low value";

                return;
            }

            pendingUtcLow = number;

            tryReconstructUtc();
        }


        // ---------------------------------------------------------
        // RECONSTRUCT UTC TIMESTAMP WHEN BOTH PARTS ARE AVAILABLE
        // ---------------------------------------------------------

        function tryReconstructUtc() {

            if (
                pendingUtcHigh === null ||
                pendingUtcLow === null
            ) {
                return;
            }

            const high = pendingUtcHigh;
            const low = pendingUtcLow;

            pendingUtcHigh = null;
            pendingUtcLow = null;

            const timestamp =
                high * 100000 +
                low;

            sendLocalTime(timestamp);
        }


        // ---------------------------------------------------------
        // CONVERT UNIX TIMESTAMP TO LOCAL DATE/TIME
        //
        // Returned as:
        //
        // YYMMDD
        // DHHMM
        // ---------------------------------------------------------

        async function sendLocalTime(utcSeconds) {

            const timestamp = Number(utcSeconds);

            if (!Number.isFinite(timestamp)) {

                document.getElementById("status").textContent =
                    "Invalid UTC timestamp";

                return;
            }

            const date = new Date(timestamp * 1000);

            const weekday = date.getDay();
            const year = date.getFullYear() % 100;
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hour = date.getHours();
            const minute = date.getMinutes();

            const yymmdd =
                year * 10000 +
                month * 100 +
                day;

            const dhhmm =
                weekday * 10000 +
                hour * 100 +
                minute;

            try {

                await PatchWorld.sendWirelessJolt(
                    "receive local yymmdd",
                    yymmdd
                );

                await PatchWorld.sendWirelessJolt(
                    "receive local dhhmm",
                    dhhmm
                );

                document.getElementById("status").textContent =
                    "Local date/time sent";

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Local time send failed";
            }
        }


        // ---------------------------------------------------------
        // PATCHWORLD REQUESTS A CLOCK SYNC
        // ---------------------------------------------------------

        PatchWorld.onInterfaceInputJoltA = function(value) {

            sendClockSync("Jolt In A");
        };


        // ---------------------------------------------------------
        // INITIAL BRIDGE CONNECTION
        // ---------------------------------------------------------

        PatchWorld.onData = function(context) {

            document.getElementById("status").textContent =
                "Patchworld connected";


            PatchWorld.subscribeWifi(
                "request utc now",
                function(value) {
                    sendUtcNow();
                }
            );


            PatchWorld.subscribeWifi(
                "send utc high",
                function(value) {
                    receiveUtcHigh(value);
                }
            );


            PatchWorld.subscribeWifi(
                "send utc low",
                function(value) {
                    receiveUtcLow(value);
                }
            );


            PatchWorld.subscribeWifi(
                "send local date",
                function(value) {
                    sendLocalDate();
                }
            );


            sendClockSync("initial connection");
        };


        // ---------------------------------------------------------
        // QUEST / PATCHWORLD WAKE DETECTION
        // ---------------------------------------------------------

        document.addEventListener(
            "visibilitychange",
            function() {

                if (document.visibilityState === "visible") {

                    document.getElementById("status").textContent =
                        "Resuming - synchronizing";

                    sendClockSync("wake");
                }
            }
        );


        // ---------------------------------------------------------
        // START VISIBLE WEBPAGE CLOCK
        // ---------------------------------------------------------

        updatePageDisplay();

        setInterval(
            updatePageDisplay,
            1000
        );

    </script>

</body>
</html>
