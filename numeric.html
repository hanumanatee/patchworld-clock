<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Numeric Clock</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        #clock {
            font-size: 48px;
        }

        .status {
            font-size: 20px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <h2>Patchworld Numeric Clock</h2>

    <div id="clock">--:--:--</div>

    <div id="bridge" class="status">
        Bridge: waiting
    </div>

    <div id="visibility" class="status">
        Visibility: unknown
    </div>

    <div id="wake" class="status">
        Wake event: none
    </div>

    <div id="sendattempt" class="status">
        Send attempt: none
    </div>

    <div id="lastsync" class="status">
        Last successful sync: none
    </div>


    <script>

        // ---------------------------------------------------------
        // CURRENT LOCAL TIME AS SECONDS SINCE MIDNIGHT
        // ---------------------------------------------------------

        function secondsSinceMidnight() {

            const now = new Date();

            return (
                now.getHours() * 3600 +
                now.getMinutes() * 60 +
                now.getSeconds() +
                now.getMilliseconds() / 1000
            );
        }


        // ---------------------------------------------------------
        // VISIBLE WEBPAGE CLOCK
        // ---------------------------------------------------------

        function updatePageDisplay() {

            const now = new Date();

            const time = now.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            });

            document.getElementById("clock").textContent = time;
        }


        // ---------------------------------------------------------
        // SEND CURRENT TIME TO PATCHWORLD
        // ---------------------------------------------------------

        async function sendClockSync(source) {

            const value = secondsSinceMidnight();

            document.getElementById("sendattempt").textContent =
                "Send attempt from " + source +
                ": " + value.toFixed(3);

            console.log(
                "Attempting clock sync from",
                source,
                value
            );

            try {

                await PatchWorld.interfaceSendJoltA(value);

                document.getElementById("lastsync").textContent =
                    "Last successful sync: " +
                    value.toFixed(3) +
                    " (" + source + ")";

                document.getElementById("sendattempt").textContent =
                    "Send succeeded from " + source;

                console.log(
                    "Clock sync succeeded:",
                    value,
                    source
                );

            }

            catch (error) {

                document.getElementById("sendattempt").textContent =
                    "SEND FAILED from " +
                    source +
                    ": " +
                    String(error);

                console.log(
                    "Clock sync FAILED:",
                    error
                );
            }
        }


        // ---------------------------------------------------------
        // PATCHWORLD MANUAL / PERIODIC SYNC REQUEST
        // ---------------------------------------------------------

        PatchWorld.onInterfaceInputJoltA = function(value) {

            console.log(
                "Jolt In A received:",
                value
            );

            sendClockSync("Jolt In A");
        };


        // ---------------------------------------------------------
        // INITIAL BRIDGE CONNECTION
        // ---------------------------------------------------------

        PatchWorld.onData = function(context) {

            document.getElementById("bridge").textContent =
                "Bridge: connected";

            console.log(
                "Patchworld bridge connected."
            );

            sendClockSync("initial bridge connection");
        };


        // ---------------------------------------------------------
        // VISIBILITY / WAKE TEST
        // ---------------------------------------------------------

        document.getElementById("visibility").textContent =
            "Visibility: " + document.visibilityState;

        document.addEventListener(
            "visibilitychange",
            function() {

                const state = document.visibilityState;

                document.getElementById("visibility").textContent =
                    "Visibility changed: " + state;

                document.getElementById("wake").textContent =
                    "Wake event received: " +
                    state +
                    " at " +
                    new Date().toLocaleTimeString();

                console.log(
                    "Visibility event:",
                    state
                );

                if (state === "visible") {

                    document.getElementById("wake").textContent =
                        "VISIBLE event received - calling sendClockSync()";

                    sendClockSync("visibilitychange");
                }
            }
        );


        // ---------------------------------------------------------
        // START PAGE DISPLAY
        // ---------------------------------------------------------

        updatePageDisplay();

        setInterval(
            updatePageDisplay,
            1000
        );

    </script>

</body>
</html>
