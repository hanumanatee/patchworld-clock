
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Wireless Test</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 30px 15px;
        }

        #revision {
            font-size: 22px;
            font-weight: bold;
        }

        #status {
            font-size: 18px;
            margin: 18px 0;
        }

        #received, #sent {
            font-size: 22px;
            margin: 15px 0;
        }

        select {
            font-size: 22px;
            padding: 8px 14px;
            margin: 10px;
        }

        button {
            font-size: 18px;
            margin: 10px;
            padding: 8px 16px;
        }
    </style>
</head>

<body>

    <div id="revision">WIRELESS TEST REV 3</div>

    <h2>Channel ID Test</h2>

    <div id="status">Waiting for Patchworld...</div>

    <div>
        Outgoing Channel ID:
        <select id="channelID">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
    </div>

    <div id="received">Received: --</div>
    <div id="sent">Echoed: --</div>

    <button onclick="clearDisplay()">Clear Display</button>

    <script>

        function clearDisplay() {

            document.getElementById("received").textContent =
                "Received: --";

            document.getElementById("sent").textContent =
                "Echoed: --";
        }


        async function echoTestValue(value) {

            document.getElementById("received").textContent =
                "Received: " + value;

            const channelID = Number(
                document.getElementById("channelID").value
            );

            try {

                await PatchWorld.sendWirelessJolt(
                    "receive test value",
                    value,
                    channelID
                );

                document.getElementById("sent").textContent =
                    "Echoed: " + value +
                    " on Channel ID " + channelID;

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Echo failed: " + error.message;
            }
        }


        PatchWorld.onData = function(context) {

            document.getElementById("status").textContent =
                "Patchworld connected";

            PatchWorld.subscribeWifi(
                "send test value",
                function(value) {
                    echoTestValue(value);
                }
            );
        };

    </script>

</body>
</html>
