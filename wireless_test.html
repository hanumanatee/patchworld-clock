
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Wireless Test</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        #revision {
            font-size: 22px;
            font-weight: bold;
        }

        #status {
            font-size: 20px;
            margin-top: 20px;
        }

        #received, #sent {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div id="revision">WIRELESS TEST REV 1</div>

    <h2>Patchworld Wireless Echo Test</h2>

    <div id="status">Waiting for Patchworld...</div>

    <div id="received">Received: --</div>

    <div id="sent">Echoed: --</div>

    <script>

        async function echoTestValue(value) {

            document.getElementById("received").textContent =
                "Received: " + value;

            try {

                await PatchWorld.sendWirelessJolt(
                    "receive test value",
                    value
                );

                document.getElementById("sent").textContent =
                    "Echoed: " + value;

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Echo failed: " + error.message;
            }
        }


        PatchWorld.onData = function(context) {

            document.getElementById("status").textContent =
                "Patchworld connected";

            PatchWorld.subscribeWifi(
                "send test value",
                function(value) {
                    echoTestValue(value);
                }
            );
        };

    </script>

</body>
</html>
