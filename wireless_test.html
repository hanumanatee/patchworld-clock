
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Patchworld Wireless Test</title>

    <script src="patchworld-bridge.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 30px 15px;
        }

        #revision {
            font-size: 22px;
            font-weight: bold;
        }

        #status {
            font-size: 18px;
            margin: 18px 0;
        }

        #suffix {
            font-size: 24px;
            font-weight: bold;
            margin: 18px 0;
        }

        #channels {
            font-size: 17px;
            margin: 18px 0;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #received, #sent {
            font-size: 22px;
            margin: 15px 0;
        }

        button {
            font-size: 18px;
            margin: 10px;
            padding: 8px 16px;
        }
    </style>
</head>

<body>

    <div id="revision">WIRELESS TEST REV 4</div>

    <h2>Dynamic Wireless Channel Test</h2>

    <div id="status">Waiting for Patchworld...</div>

    <div id="suffix">Device suffix: --</div>

    <div id="channels">
        Incoming: --<br>
        Outgoing: --
    </div>

    <div id="received">Received: --</div>
    <div id="sent">Echoed: --</div>

    <button onclick="clearDisplay()">Clear Display</button>

    <script>

        let deviceSuffix = null;
        let incomingChannel = null;
        let outgoingChannel = null;
        let initialized = false;


        // ---------------------------------------------------------
        // CLEAR TEST RESULTS
        // ---------------------------------------------------------

        function clearDisplay() {

            document.getElementById("received").textContent =
                "Received: --";

            document.getElementById("sent").textContent =
                "Echoed: --";
        }


        // ---------------------------------------------------------
        // RECEIVE DEVICE SUFFIX VIA WEB BRIDGE JOLT A
        // ---------------------------------------------------------

        PatchWorld.onInterfaceInputJoltA = function(value) {

            const suffix = Number(value);

            if (
                !Number.isInteger(suffix) ||
                suffix <= 10000 ||
                suffix >= 100000
            ) {

                document.getElementById("status").textContent =
                    "Invalid suffix: " + value;

                return;
            }

            if (initialized) {

                if (suffix === deviceSuffix) {
                    document.getElementById("status").textContent =
                        "Already initialized";
                } else {
                    document.getElementById("status").textContent =
                        "Different suffix received; reload page";
                }

                return;
            }

            initializeDevice(suffix);
        };


        // ---------------------------------------------------------
        // CONSTRUCT NAMES AND SUBSCRIBE
        // ---------------------------------------------------------

        async function initializeDevice(suffix) {

            if (initialized) {
                return;
            }

            initialized = true;
            deviceSuffix = suffix;

            incomingChannel =
                "send_test_value_" + deviceSuffix;

            outgoingChannel =
                "receive_test_value_" + deviceSuffix;

            document.getElementById("suffix").textContent =
                "Device suffix: " + deviceSuffix;

            document.getElementById("channels").innerHTML =
                "Incoming: " + incomingChannel + "<br>" +
                "Outgoing: " + outgoingChannel;

            document.getElementById("status").textContent =
                "Subscribing...";

            try {

                await PatchWorld.subscribeWifi(
                    incomingChannel,
                    function(value) {
                        echoTestValue(value);
                    }
                );

                document.getElementById("status").textContent =
                    "Subscribed and ready";

            }

            catch (error) {

                initialized = false;

                document.getElementById("status").textContent =
                    "Subscription failed: " + error.message;
            }
        }


        // ---------------------------------------------------------
        // ECHO RECEIVED VALUE ON DEVICE-SPECIFIC CHANNEL
        // ---------------------------------------------------------

        async function echoTestValue(value) {

            document.getElementById("received").textContent =
                "Received: " + value;

            try {

                await PatchWorld.sendWirelessJolt(
                    outgoingChannel,
                    value,
                    0
                );

                document.getElementById("sent").textContent =
                    "Echoed: " + value;

            }

            catch (error) {

                document.getElementById("status").textContent =
                    "Echo failed: " + error.message;
            }
        }


        // ---------------------------------------------------------
        // PATCHWORLD BRIDGE CONNECTION
        // ---------------------------------------------------------

        PatchWorld.onData = function(context) {

            document.getElementById("status").textContent =
                initialized
                    ? "Device initialized"
                    : "Bridge connected; waiting for suffix";
        };

    </script>

</body>
</html>
